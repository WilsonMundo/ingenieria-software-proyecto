<div class="modal-container">
  <h2 class="modal-title">Registrar Vaticinio</h2>
  <div class="match-info">
    <div class="match-name">
      {{ data.encuentro }}
    </div>
    <div class="match-date">
      {{ data.fecha_y_hora }}
    </div>
  </div>
  <div class="score-container">
    <div class="team-score">
      <span class="team-label">Local</span>
      <mat-form-field appearance="fill" class="score-input">
        <mat-label>Goles</mat-label>
        <input matInput type="number" min="0" [(ngModel)]="golesLocal"/>
      </mat-form-field>
    </div>
    <div class="vs-text">VS</div>
    <div class="team-score">
      <span class="team-label">Visitante</span>
      <mat-form-field appearance="fill" class="score-input">
        <mat-label>Goles</mat-label>
        <input matInput type="number" min="0" [(ngModel)]="golesVisitante"/>
      </mat-form-field>
    </div>
  </div>
  <div class="actions">
    <button mat-button class="cancel-button" (click)="close()">Cancelar</button>
    <button mat-flat-button color="primary" class="save-button" (click)="save()">Guardar</button>
  </div>
</div>
