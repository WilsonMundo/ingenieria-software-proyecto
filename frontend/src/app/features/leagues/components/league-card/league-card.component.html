<mat-card class="league-card">
  <mat-card-content>
    <!-- Header -->
    <div class="card-header">
      <div class="header-content">
        <h3 class="league-title">
          {{ league.nombre }}
        </h3>
        <div class="badges">
          <span class="type-badge">
            {{ league.tipo_liga }}
          </span>
          <span class="status-badge" [ngClass]="league.estado.toLowerCase()">
            {{ league.estado }}
          </span>
          <span class="role-badge" [ngClass]="league.rol_liga">
            {{ league.rol_liga }}
          </span>
        </div>
      </div>
    </div>
    <!-- Stats -->
    <div class="stats-section">
      <div class="info-row">
        <div class="info-label">
          <span>Participantes</span>
        </div>
        <span class="value">
        {{ league.total_participantes }}
        </span>
      </div>
      <div class="info-row">
        <div class="info-label">
          <span>Tu Posición</span>
        </div>
        <span class="rank-value">
          #3
        </span>
      </div>
      <div class="info-row">
        <div class="info-label">
          <span>Premio</span>
        </div>
        <span class="prize-value">
          Q{{ league.precio_participacion }}
        </span>
      </div>
    </div>
    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">
          Progreso
        </span>
        <span class="progress-value">
          65%
        </span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 65%;"></div>
      </div>
    </div>
  </mat-card-content>
  <!-- Footer -->
  <mat-card-actions class="card-actions">
    <button mat-flat-button class="view-button" [routerLink]="['/principal/ligas', league.id_liga]">
      Ver Liga →
    </button>
  </mat-card-actions>
</mat-card>
