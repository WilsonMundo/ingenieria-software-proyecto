<div class="reset-page">
  <mat-card class="reset-card">
    <div class="icon-box">
      <mat-icon>lock_reset</mat-icon>
    </div>

    <h1>Restablecer contraseña</h1>
    <p>Ingresa tu nueva contraseña para recuperar el acceso.</p>

    <p class="error-message" *ngIf="mensajeError">
      {{ mensajeError }}
    </p>

    <p class="success-message" *ngIf="mensajeExito">
      {{ mensajeExito }}
    </p>

    <form (ngSubmit)="restablecerPassword()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nueva contraseña</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          name="nuevaPassword"
          [(ngModel)]="nuevaPassword"
          required
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar contraseña</mat-label>
        <input
          matInput
          [type]="hideConfirmPassword ? 'password' : 'text'"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          required
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideConfirmPassword = !hideConfirmPassword"
        >
          <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="full-width submit-button"
        type="submit"
        [disabled]="!token"
      >
        Actualizar contraseña
      </button>
    </form>

    <button
      mat-stroked-button
      class="full-width back-button"
      type="button"
      routerLink="/login"
    >
      Volver al login
    </button>
  </mat-card>
</div>
