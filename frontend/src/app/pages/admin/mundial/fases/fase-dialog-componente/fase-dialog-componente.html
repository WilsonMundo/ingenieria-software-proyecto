<h2 mat-dialog-title>{{ esEdicion ? 'Editar Fase' : 'Nueva Fase' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Torneo</mat-label>
      <mat-select formControlName="id_torneo">
        @for (t of torneos; track t.id_torneo) { <mat-option [value]="t.id_torneo">{{t.nombre}} {{t.anio}}</mat-option> }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Nombre de la Fase</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: Grupos, Octavos, Cuartos..." />
    </mat-form-field>
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Orden de la Fase</mat-label>
      <input matInput type="number" formControlName="orden_fase" min="1" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="guardando">
    @if (guardando) { <mat-spinner diameter="20"/> } @else { {{ esEdicion ? 'Actualizar' : 'Guardar' }} }
  </button>
</mat-dialog-actions>
