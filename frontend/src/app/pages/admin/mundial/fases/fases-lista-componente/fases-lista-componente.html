<div class="lista-header">
  <h2 class="lista-titulo"><mat-icon>layers</mat-icon> Fases del Torneo</h2>
  <button mat-raised-button color="primary" (click)="abrirDialog()"><mat-icon>add</mat-icon> Nueva Fase</button>
</div>
@if (cargando) { <div class="spinner-container"><mat-spinner diameter="48"/></div>
} @else {
  <table mat-table [dataSource]="fases" class="mat-elevation-z2 tabla-completa">
    <ng-container matColumnDef="orden_fase"><th mat-header-cell *matHeaderCellDef>Orden</th><td mat-cell *matCellDef="let f">{{f.orden_fase}}</td></ng-container>
    <ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef>Nombre de la Fase</th><td mat-cell *matCellDef="let f"><strong>{{f.nombre}}</strong></td></ng-container>
    <ng-container matColumnDef="id_torneo"><th mat-header-cell *matHeaderCellDef>Torneo ID</th><td mat-cell *matCellDef="let f">{{f.id_torneo}}</td></ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let f">
        <button mat-icon-button color="accent" (click)="abrirDialog(f)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="eliminar(f)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
}
