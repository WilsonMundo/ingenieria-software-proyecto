<div class="lista-header">
  <h2 class="lista-titulo"><mat-icon>stadium</mat-icon> Estadios</h2>
  <button mat-raised-button color="primary" (click)="abrirDialog()"><mat-icon>add</mat-icon> Nuevo Estadio</button>
</div>
@if (cargando) {
  <div class="spinner-container"><mat-spinner diameter="48" /></div>
} @else {
  <table mat-table [dataSource]="estadios" class="mat-elevation-z2 tabla-completa">
    <ng-container matColumnDef="id_estadio"><th mat-header-cell *matHeaderCellDef>#</th><td mat-cell *matCellDef="let e">{{e.id_estadio}}</td></ng-container>
    <ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef>Nombre</th><td mat-cell *matCellDef="let e">{{e.nombre}}</td></ng-container>
    <ng-container matColumnDef="sede"><th mat-header-cell *matHeaderCellDef>Sede</th><td mat-cell *matCellDef="let e">{{e.sede?.nombre ?? e.id_sede}}</td></ng-container>
    <ng-container matColumnDef="capacidad"><th mat-header-cell *matHeaderCellDef>Capacidad</th><td mat-cell *matCellDef="let e">{{e.capacidad ?? '—'}}</td></ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button color="accent" matTooltip="Editar" (click)="abrirDialog(e)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(e)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    <tr class="mat-row" *matNoDataRow><td class="mat-cell sin-datos" [attr.colspan]="columnas.length">No hay estadios registrados.</td></tr>
  </table>
}
