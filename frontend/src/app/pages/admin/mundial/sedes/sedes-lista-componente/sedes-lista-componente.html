<div class="lista-header">
  <h2 class="lista-titulo">
    <mat-icon>location_city</mat-icon> Sedes del Torneo
  </h2>
  <button mat-raised-button color="primary" (click)="abrirDialog()">
    <mat-icon>add</mat-icon> Nueva Sede
  </button>
</div>

@if (cargando) {
  <div class="spinner-container">
    <mat-spinner diameter="48" />
  </div>
} @else {
  <table mat-table [dataSource]="sedes" class="mat-elevation-z2 tabla-completa">

    <ng-container matColumnDef="id_sede">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let s">{{ s.id_sede }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let s">{{ s.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="ciudad">
      <th mat-header-cell *matHeaderCellDef>Ciudad</th>
      <td mat-cell *matCellDef="let s">{{ s.ciudad }}</td>
    </ng-container>

    <ng-container matColumnDef="pais_sede">
      <th mat-header-cell *matHeaderCellDef>País</th>
      <td mat-cell *matCellDef="let s">{{ s.pais_sede }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let s">
        <button mat-icon-button color="accent" matTooltip="Editar" (click)="abrirDialog(s)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(s)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
        No hay sedes registradas.
      </td>
    </tr>
  </table>
}
