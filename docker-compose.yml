services:
  db:
    image: postgres:16-alpine
    container_name: football_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ligamundial_bd}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PASSWORD_DB:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/sql/pais_grupo.sql:/docker-entrypoint-initdb.d/02-pais-grupo.sql:ro
      - ./backend/sql/clasificacion_triggers.sql:/docker-entrypoint-initdb.d/03-clasificacion-triggers.sql:ro
      - ./backend/sql/proceso6_premios_auditoria.sql:/docker-entrypoint-initdb.d/04-premios-auditoria.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - football_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: football_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Liga Mundial API}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ligamundial_bd}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${PASSWORD_DB:-postgres}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Liga Mundial}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - football_net

volumes:
  postgres_data:

networks:
  football_net:
    driver: bridge
